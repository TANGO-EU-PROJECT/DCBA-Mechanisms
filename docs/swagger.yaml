   # [4] POST /devices/behavioural-score
  /resource/behavioural-score:
    post:
      tags:
        - Resource API Endpoints
      security:
        - bearerAuth: []
      summary: Retrieve device behavioural score
      description: >
        Returns the behavioural score of a device based on provided DIDs.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - didSP
                - didRequester
              properties:
                didSP:
                  type: string
                  description: The Decentralized Identifier (DID) of the service provider initiating the request.
                  example: "did:example:serviceprovider123"
                didRequester:
                  type: string
                  description: The Decentralized Identifier (DID) of the requesting employee.
                  example: "did:jwk:eyJrdHkiOiJFQyIsImNydiI6IlAtMjU2Iiwia2lkIjoiMDVhZ0UxdXZPcW1yVDRLY2NiZ1ZKenAwRmJ5SF9weXE4WE5mU2VoOHRkSSIsIngiOiJDRTVqODFybWxqV1JoM1FEOFlJQVNGb093SzRrMjRqU0pWVWEtdl9rSTVZIiwieSI6IjBRU29vbktGVXA4Y0ZLd0dwWHhLSjlSeEZJTk9BOHpWd0ZCTTloQzRKczgifQ"

            examples:
              validRequest:
                summary: Valid request example
                value:
                  didSP: "did:example:serviceprovider123"
                  didRequester: "did:jwk:eyJrdHkiOiJFQyIsImNydiI6IlAtMjU2Iiwia2lkIjoiMDVhZ0UxdXZPcW1yVDRLY2NiZ1ZKenAwRmJ5SF9weXE4WE5mU2VoOHRkSSIsIngiOiJDRTVqODFybWxqV1JoM1FEOFlJQVNGb093SzRrMjRqU0pWVWEtdl9rSTVZIiwieSI6IjBRU29vbktGVXA4Y0ZLd0dwWHhLSjlSeEZJTk9BOHpWd0ZCTTloQzRKczgifQ"
      responses:
        '200':
          description: Behavioural score retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "success"
                  message:
                    type: string
                    example: "Device found"
                  behaviouralScore:
                    type: number
                    format: float
                    example: 0.85
        '400':
          description: Bad Request - Missing required fields
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "failed"
                  message:
                    type: string
                    example: "Missing required fields: didSP or didRequester"
        '404':
          description: Device not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "failed"
                  message:
                    type: string
                    example: "Device not found"
        '500':
          description: Internal server error while retrieving behavioural score 
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "failed"
                  message:
                    type: string
              examples:
                Error retrieving behavioural score:
                  summary: Error retrieving behavioural score
                  value:
                    status: "failed"
                    message: "Error retrieving behavioural score"
                Error processing request:
                  summary: Error processing request
                  value:
                    status: "failed"
                    message: "Error processing request"


  # [5] POST /resource/last-location
  /resource/last-location:
    post:
      tags:
        - Resource API Endpoints
      summary: Retrieve device last location
      description: >
        Returns the last location of a device
        based on provided employee DIDs.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - didRequester
                - timezone
              properties:
                didRequester:
                  type: string
                  description: The Decentralized Identifier (DID) of the requesting employee.
                  example: "did:jwk:eyJrdHkiOiJFQyIsImNydiI6IlAtMjU2Iiwia2lkIjoiMDVhZ0UxdXZPcW1yVDRLY2NiZ1ZKenAwRmJ5SF9weXE4WE5mU2VoOHRkSSIsIngiOiJDRTVqODFybWxqV1JoM1FEOFlJQVNGb093SzRrMjRqU0pWVWEtdl9rSTVZIiwieSI6IjBRU29vbktGVXA4Y0ZLd0dwWHhLSjlSeEZJTk9BOHpWd0ZCTTloQzRKczgifQ"
                timezone: 
                  type: string
                  description: >
                    Preferred IANA timezone name to interpret the 'from' and 'to' parameters for filtering location history, and to format the returned timestamps accordingly.
                    Example values include: Europe/Athens, Europe/Lisbon, Asia/Tokyo.
                  example: "Europe/Athens"
            examples:
              validRequest:
                summary: Valid request example
                value:
                  didRequester: "did:jwk:eyJrdHkiOiJFQyIsImNydiI6IlAtMjU2Iiwia2lkIjoiMDVhZ0UxdXZPcW1yVDRLY2NiZ1ZKenAwRmJ5SF9weXE4WE5mU2VoOHRkSSIsIngiOiJDRTVqODFybWxqV1JoM1FEOFlJQVNGb093SzRrMjRqU0pWVWEtdl9rSTVZIiwieSI6IjBRU29vbktGVXA4Y0ZLd0dwWHhLSjlSeEZJTk9BOHpWd0ZCTTloQzRKczgifQ"
                  timezone: "Europe/Athens"
      responses:
        '200':
          description: Last known device location retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "success"
                  message:
                    type: string
                    example: "Device found"
                  lastLocation:
                    type: string
                    example: "WAREHOUSE"
                  firstSeenAt:
                    type: string
                    format: date-time
                    example: "2025-05-29 11:17:50"
                  lastSeenAt:
                    type: string
                    format: date-time
                    example: "2025-05-29 11:18:50"
                  durationSeconds:
                    type: integer
                    example: 60

        '400':
          description: Bad Request - Missing required fields or invalid timezone
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "failed"
                  message:
                    type: string
              examples:
                missingFields:
                  summary: Missing required fields
                  value:
                    status: "failed"
                    message: "Missing required fields: didRequester or timezone"
                invalidTimezone:
                  summary: Invalid timezone format
                  value:
                    status: "failed"
                    message: "Invalid timezone. Please provide a valid IANA timezone name (e.g. 'Europe/Athens', 'America/New_York')"

        '404':
          description: Device not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "failed"
                  message:
                    type: string
              examples:
                deviceNotFound:
                  summary: Device not found message
                  value:
                    status: "failed"
                    message: "Device not found"
                accessMapNotFound:
                  summary: Access map missing for device with ePassportId
                  value:
                    status: "failed"
                    message: "Access map for device associated with ePassportId 123456789 not found"
        '500':
          description: Internal server error while retrieving last location
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "failed"
                  message:
                    type: string
              examples:
                Error retrieving retrieving last location:
                  summary: Internal server error while retrieving last location
                  value:
                    status: "failed"
                    message: "Error retrieving device last location"
                Error processing request:
                  summary: Error processing request
                  value:
                    status: "failed"
                    message: "Error processing request"


  # [6] POST /resource/location-history
  /resource/location-history:
    post:
      tags:
        - Resource API Endpoints
      summary: Retrieve device location history within a specified timeframe
      description: >
        Returns the location history of a device based on provided employee DIDs.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - didRequester
                - from
                - to
                - timezone
              properties:
                didRequester:
                  type: string
                  description: The Decentralized Identifier (DID) of the requesting employee.
                  example: "did:jwk:eyJrdHkiOiJFQyIsImNydiI6IlAtMjU2Iiwia2lkIjoiMDVhZ0UxdXZPcW1yVDRLY2NiZ1ZKenAwRmJ5SF9weXE4WE5mU2VoOHRkSSIsIngiOiJDRTVqODFybWxqV1JoM1FEOFlJQVNGb093SzRrMjRqU0pWVWEtdl9rSTVZIiwieSI6IjBRU29vbktGVXA4Y0ZLd0dwWHhLSjlSeEZJTk9BOHpWd0ZCTTloQzRKczgifQ"
                from:
                  type: string
                  description: "Local start date-time in the specified timezone for filtering the location history: 'YYYY-MM-DD HH:mm:ss'."
                  example: "2025-05-28 12:00:00"
                to:
                  type: string
                  description: "Local start date-time in the specified timezone for filtering the location history: 'YYYY-MM-DD HH:mm:ss'."
                  example: "2025-07-30 12:15:00"
                timezone: 
                  type: string
                  description: >
                    Preferred IANA timezone name to interpret the 'from' and 'to' parameters for filtering location history, and to format the returned timestamps accordingly.
                    Example values include: Europe/Athens, Europe/Lisbon, Asia/Tokyo.
                  example: "Europe/Athens"
            examples:
              validRequest:
                summary: Valid request example
                value:
                  didRequester: "did:jwk:eyJrdHkiOiJFQyIsImNydiI6IlAtMjU2Iiwia2lkIjoiMDVhZ0UxdXZPcW1yVDRLY2NiZ1ZKenAwRmJ5SF9weXE4WE5mU2VoOHRkSSIsIngiOiJDRTVqODFybWxqV1JoM1FEOFlJQVNGb093SzRrMjRqU0pWVWEtdl9rSTVZIiwieSI6IjBRU29vbktGVXA4Y0ZLd0dwWHhLSjlSeEZJTk9BOHpWd0ZCTTloQzRKczgifQ"
                  from: "2025-05-28 12:00:00"
                  to: "2025-07-30 12:15:00"
                  timezone: "Europe/Athens"
      responses:
        '200':
          description: Device location history retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "success"
                  message:
                    type: string
                    example: "Device location history retrieved"
              examples:
                NoLocationHistoryFound:
                  summary: Example response with no location history
                  value:
                    status: "success"
                    message: "Device location history retrieved"
                    location_history: []
                singleLocation:
                  summary: Example response with single location entry
                  value:
                    status: "success"
                    message: "Device location history retrieved"
                    location_history:
                      - estimated_location: "WAREHOUSE"
                        firstSeenAt: "2025-05-29 11:19:26"
                        lastSeenAt: "2025-05-29 11:20:36"
                        durationSeconds: 70
                multipleLocations:
                  summary: Example response with multiple location entries
                  value:
                    status: "success"
                    message: "Device location history retrieved"
                    location_history:
                      - estimated_location: "WAREHOUSE"
                        firstSeenAt: "2025-05-29 11:19:26"
                        lastSeenAt: "2025-05-29 11:20:36"
                        durationSeconds: 70
                      - estimated_location: "PACKAGING_LINES"
                        firstSeenAt: "2025-05-29 11:20:36"
                        lastSeenAt: "2025-05-29 11:21:41"
                        durationSeconds: 65
                      - estimated_location: "PERMITTED_AREA"
                        firstSeenAt: "2025-05-29 11:21:41"
                        lastSeenAt: "2025-05-29 11:22:00"
                        durationSeconds: 19
        '400':
          description: Bad Request - Missing required fields or invalid timeframe
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "failed"
                  message:
                    type: string
              examples:
                MissingFields:
                  summary: Missing required fields
                  value:
                    status: "failed"
                    message: "Missing required fields: didRequester, from, to, or timezone"
                InvalidTimestamps:
                  summary: Invalid timestamp format
                  value:
                    status: "failed"
                    message: "Invalid from/to format. Both must be local datetime strings like 'YYYY-MM-DD HH:mm:ss'"
                InvalidTimezone:
                  summary: Invalid timezone format
                  value:
                    status: "failed"
                    message: "Invalid timezone. Please provide a valid IANA timezone name (e.g. 'Europe/Athens', 'America/New_York')"
        '404':
          description: Device not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "failed"
                  message:
                    type: string
              examples:
                deviceNotFound:
                  summary: Device not found message
                  value:
                    status: "failed"
                    message: "Device not found"
                accessMapNotFound:
                  summary: Access map missing for device with ePassportId
                  value:
                    status: "failed"
                    message: "Access map for device associated with ePassportId 123456789 not found"
        '500':
          description: Internal server error while retrieving device location history
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "failed"
                  message:
                    type: string
              examples:
                Error retrieving device location history:
                  summary: Error retrieving device location history
                  value:
                    status: "failed"
                    message: "Error retrieving device location history"
                Error processing request:
                  summary: Error processing request
                  value:
                    status: "failed"
                    message: "Error processing request"



