                timezone: 
                  type: string
                  description: >
                    Preferred IANA timezone name to interpret the 'from' and 'to' parameters for filtering location history, and to format the returned timestamps accordingly.
                    Example values include: Europe/Athens, Europe/Lisbon, Asia/Tokyo.
                  example: "Europe/Athens"
            examples:
              validRequest:
                summary: Valid request example
                value:
