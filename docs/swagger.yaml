  # [9] GET /resource/alerts
  /resource/alerts:
    get:
      tags:
        - Resource API Endpoints
      summary: Retrieve all history alert related to devices presence in Restricted Areas.
      description: >
        Returns the restricted location history of a device based on provided employee DIDs.
      parameters:
        - name: timezone
          in: query
          description: >
            Preferred IANA timezone name to interpret timestamps and format returned dates accordingly.
            Example: Europe/Athens, Europe/Lisbon, Asia/Tokyo.
          required: true
          schema:
            type: string
            example: Europe/Athens
        - name: from
          in: query
          description: >
            Optional lower bound of the time range to filter alerts.
            Must be a local datetime string in the format 'YYYY-MM-DD HH:mm:ss'.
          required: false
          schema:
            type: string
            example: "2025-05-28 00:00:00"
        - name: to
          in: query
          description: >
            Optional upper bound of the time range to filter alerts.
            Must be a local datetime string in the format 'YYYY-MM-DD HH:mm:ss'.
          required: false
          schema:
            type: string
            example: "2025-07-30 12:15:00"
      responses:
        '200':
          description: Alerts retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Alerts retrieved successfully
                  timezone:
                    type: string
                    example: Europe/Athens
                  alerts:
                    type: array
                    items:
                      type: object
                      properties:
                        device_id:
                          type: string
                          example: "5c487cb4a62cb29d"
