openapi: 3.0.0
info:
  title: Devices Continuous Behavioural Authentication (DCBA) Mechanisms API
  version: 1.0.0
  description: |
    API documentation for the DCBA Services.

    The **Authenticator Endpoints** are exclusively utilized by the Android application, 'Authenticator', which is deployed on employees' devices. 

    To interact with the **GET** endpoints of the **Service API Endpoints**, you must authorize by providing a JWT Authorization token.

    For testing purposes, you can use the following JWT token: **eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpYXQiOjE3NDgzNTU1OTcsImV4cCI6MTc0ODM1OTE5N30.-lYhqebZ6_z8waY8C3E_0ZfRKGslp4jB39qirYbw0mM**


    **Steps to authorize:**

    1. Click the **Authorize** button, at the top-right corner.
    2. Enter the token specified in the description.
    3. Click **Authorize** and close the dialog.
    4. You can now use the **Try it out** button on the Service API Endpoints.



servers:
  - url: https://k8s-cluster.tango.rid-intrasoft.eu/development/dcba-backend/

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT



paths:
  # Service API Endpoints #

  # [1] GET /devices
  /devices:
    get:
      security:
        - bearerAuth: []
      tags:
        - Service API Endpoints  # Tag for service-facing endpoints
      summary: Fetch all devices
      description: Retrieves all device entries from the database. This route requires a valid JWT Bearer token in the Authorization header to access.
      responses:
        '200':
          description: Successfully fetched devices
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "success"
                  message:
                    type: string
                    example: "Devices fetched successfully."
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        device_id:
                          type: string
                          example: "5c487cb4a62cb29d"
                        did:
                          type: string
                          example: "did:example:123456789abcdefghi"
                        sub:
                          type: string
                          example: "user@example.com"
        '401':
          description: Authorization token is missing or malformed
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
              examples:
                MissingAuthorizationToken:
                  summary: Missing Authorization header
                  value:
                    status: "failed"
                    message: "Authorization token is missing."
                MalformedAuthorizationToken:
                  summary: Malformed Authorization header
                  value:
                    status: "failed"
                    message: "Authorization token is malformed. It should start with 'Bearer '."
        '403':
          description: Unauthorized - Authorization token is invalid or expired
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
              examples:
                ExpiredToken:
                  summary: Authorization token has expired
                  value:
                    status: "failed"
                    message: "Authorization token has expired."
                InvalidToken:
                  summary: Authorization token is invalid
                  value:
                    status: "failed"
                    message: "Invalid Authorization token."
        '500':
          description: Internal server error while fetching devices
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "failed"
                  message:
                    type: string
                    example: "Error fetching device data."




  # [2] GET /devices/online-shifts  
  /devices/online-shifts:
    get:
      tags:
        - Service API Endpoints  # Tag for service-facing endpoints
      security:
        - bearerAuth: []
      summary: Fetch online devices
      description: Retrieves devices that are currently online. This route requires a valid JWT Bearer token in the Authorization header to access.
      responses:
        '200':
          description: Successfully fetched online devices
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "success"
                  message:
                    type: string
                    example: "Fetched online devices successfully."
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        device_id:
                          type: string
                          example: "5c487cb4a62cb29d"
                        did:
                          type: string
                          example: "did:example:123456789abcdefghi"
                        sub:
                          type: string
                          example: "user@example.com"
        '401':
          description: Authorization token is missing or malformed
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
              examples:
                MissingAuthorizationToken:
                  summary: Missing Authorization header
                  value:
                    status: "failed"
                    message: "Authorization token is missing."
                MalformedAuthorizationToken:
                  summary: Malformed Authorization header
                  value:
                    status: "failed"
                    message: "Authorization token is malformed. It should start with 'Bearer '."
        '403':
          description: Unauthorized - Authorization token is invalid or expired
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
              examples:
                ExpiredToken:
                  summary: Authorization token has expired
                  value:
                    status: "failed"
                    message: "Authorization token has expired."
                InvalidToken:
                  summary: Authorization token is invalid
                  value:
                    status: "failed"
                    message: "Invalid Authorization token."
        '500':
          description: Internal server error while fetching online devices
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "failed"
                  message:
                    type: string
                    example: "Error fetching online devices."





  # [3] GET /devices/offline-shifts
  /devices/offline-shifts:
    get:
      tags:
        - Service API Endpoints
      security:
        - bearerAuth: []
      summary: Fetch offline devices
      description: Retrieves devices that are currently offline. This route requires a valid JWT Bearer token in the Authorization header to access.
      responses:
        '200':
          description: Successfully fetched offline devices
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "success"
                  message:
                    type: string
                    example: "Fetched offline devices successfully."
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        device_id:
                          type: string
                          example: "5c487cb4a62cb29d"
                        did:
                          type: string
                          example: "did:example:987654321zyxwvu"
                        sub:
                          type: string
                          example: "anotheruser@example.com"
        '401':
          description: Authorization token is missing or malformed
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
              examples:
                MissingAuthorizationToken:
                  summary: Missing Authorization header
                  value:
                    status: "failed"
                    message: "Authorization token is missing."
                MalformedAuthorizationToken:
                  summary: Malformed Authorization header
                  value:
                    status: "failed"
                    message: "Authorization token is malformed. It should start with 'Bearer '."
        '403':
          description: Unauthorized - Authorization token is invalid or expired
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
              examples:
                ExpiredToken:
                  summary: Authorization token has expired
                  value:
                    status: "failed"
                    message: "Authorization token has expired."
                InvalidToken:
                  summary: Authorization token is invalid
                  value:
                    status: "failed"
                    message: "Invalid Authorization token."
        '500':
          description: Internal server error while fetching offline devices
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "failed"
                  message:
                    type: string
                    example: "Error fetching offline devices."


  # [4] POST /devices/behavioural-score
  /devices/behavioural-score:
    post:
      tags:
        - Service API Endpoints
      summary: Retrieve device behavioural score
      description: >
        Returns the behavioural score of a device based on provided DIDs.
        Requires a valid JWT authorization token passed in the request body.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - didSP
                - didRequester
              properties:
                didSP:
                  type: string
                  description: The Decentralized Identifier (DID) of the service provider initiating the request.
                  example: "did:example:serviceprovider123"
                didRequester:
                  type: string
                  description: The Decentralized Identifier (DID) of the requesting employee.
                  example: "did:example:device456"

            examples:
              validRequest:
                summary: Valid request example
                value:
                  didSP: "did:example:serviceprovider123"
                  didRequester: "did:example:device456"
      responses:
        '200':
          description: Behavioural score retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "success"
                  message:
                    type: string
                    example: "Device found."
                  behaviouralScore:
                    type: number
                    format: float
                    example: 0.85
        '400':
          description: Bad Request - Missing required fields
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "failed"
                  message:
                    type: string
                    example: "Missing required fields: didSP or didRequester."
        '401':
          description: Unauthorized - Authorization token is invalid or expired
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "failed"
                  message:
                    type: string
              examples:
                TokenExpired:
                  summary: Authorization token has expired
                  value:
                    status: "failed"
                    message: "Authorization token has expired."
                InvalidToken:
                  summary: Authorization token is invalid
                  value:
                    status: "failed"
                    message: "Invalid authorization token."
        '404':
          description: Device not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "failed"
                  message:
                    type: string
                    example: "Device not found."
        '500':
          description: Internal server error while retrieving behavioural score 
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "failed"
                  message:
                    type: string
                    example: "Error retrieving behavioural score."

  # [5] POST /devices/last-location
  /devices/last-location:
    post:
      tags:
        - Service API Endpoints
      summary: Retrieve device last known location
      description: >
        Returns the last known location of a device
        based on provided employee DIDs.
        Requires a valid JWT authorization token passed in the request body.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - didSP
                - didRequester
                - jwtAuth
              properties:
                didSP:
                  type: string
                  description: The Decentralized Identifier (DID) of the service provider initiating the request.
                  example: "did:example:serviceprovider123"
                didRequester:
                  type: string
                  description: The Decentralized Identifier (DID) of the requesting employee.
                  example: "did:example:device456"
                jwtAuth:
                  type: string
                  description: The JSON Web Token (JWT) used for authenticating the request.
                  example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
            examples:
              validRequest:
                summary: Valid request example
                value:
                  didSP: "did:example:serviceprovider123"
                  didRequester: "did:example:device456"
                  jwtAuth: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
      responses:
        '200':
          description: Last known device location retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "success"
                  message:
                    type: string
                    example: "Device found."
                  lastLocation:
                    type: string
                    example: "Facility Entrance"
        '400':
          description: Bad Request - Missing required fields
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "failed"
                  message:
                    type: string
                    example: "Missing required fields: didSP, didRequester, or jwtAuth."
        '401':
          description: Unauthorized - Authorization token is invalid or expired
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "failed"
                  message:
                    type: string
                    example: "Authorization error message"
              examples:
                TokenExpired:
                  summary: Authorization token has expired
                  value:
                    status: "failed"
                    message: "Authorization token has expired."
                InvalidToken:
                  summary: Authorization token is invalid
                  value:
                    status: "failed"
                    message: "Invalid authorization token."

        '404':
          description: Device not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "failed"
                  message:
                    type: string
                    example: "Device not found."
        '500':
          description: Internal server error while retrieving last coordinates
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "failed"
                  message:
                    type: string
                    example: "Error retrieving last coordinates."

  # Service API Endpoints # 
















































  # Authenticator Endpoints #

  # [1] POST /authenticator/begin-session
  /authenticator/begin-session:
    post:
      summary: Handle device initiation process (QR SCANNER)
      description: Initiates a device session request by upserting into the database and generating a login QR. The result is reflected in the HTTP status and JSON body.
      tags:
        - Authenticator Endpoints
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - device_id
                - qr_scanner_state_request
                - log_file_uri
              properties:
                device_id:
                  type: string
                  description: The ID of the device initiating the session.
                  example: 5c487cb4a62cb29d
                qr_scanner_state_request:
                  type: string
                  description: The state parameter for QR scanner.
                  example: a6f3fn529i2a0
                log_file_uri:
                  type: string
                  description: Log file URI, where offline logs will be appended for future transmission.
                  example: file:///data/user/0/com.dcbaauthenticator/files/46299a77c27b0d4c/authenticator_logs.txt
      responses:
        '200':
          description: Session request successfully created or updated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [success]
                  message:
                    type: string
                  deviceAuthQRCode:
                    type: string
                    description: The QR code (only present on success).
                  sessionRequest:
                    type: object
                    description: The session request object that was saved or updated.
              examples:
                Success:
                  summary: Successful session request
                  value:
                    status: success
                    message: QR Code generated successfully.
                    deviceAuthQRCode: "data:image/png;base64,..."
                    sessionRequest:
                      device_id: "5c487cb4a62cb29d"
                      qr_scanner_state_request: "a6f3fn529i2a0"
                      log_file_uri: "file:///data/user/0/com.dcbaauthenticator/files/46299a77c27b0d4c/authenticator_logs.txt"
                      timestamp: "2025-04-26T12:34:56.789Z"
        '400':
          description: Missing required input fields.
          content:
            application/json:
              examples:
                MissingDeviceID:
                  summary: Missing device_id
                  value:
                    status: failed
                    message: Device ID is missing, session request failed.
                MissingQrScannerState:
                  summary: Missing qr_scanner_state_request
                  value:
                    status: failed
                    message: QR scanner state request is missing, session request failed.
        '502':
          description: Error in verifier service response.
          content:
            application/json:
              examples:
                QRCodeNotFound:
                  summary: QR code not found in verifier response
                  value:
                    status: failed
                    message: QR code not found in the verifier service response.

        '500':
          description: Internal error during session request handling.
          content:
            application/json:
              examples:
                SessionHandlingError:
                  summary: Internal Server Error during session request
                  value:
                    status: failed
                    message: Error handling session request.
                QRCodeExtractionError:
                  summary: QR code extraction failure
                  value:
                    status: failed
                    message: Failed to extract QR code due to an internal server error.



  # [2] GET /authenticator/auth-callback
  /authenticator/auth-callback:
    get:
      summary: Handle the authentication callback from Tango Verifier
      description: >
        Exchanges an authorization code for a token, decodes the JWT, validates the device session request,
        and returns the appropriate status depending on session and device state.
      tags:
        - Authenticator Endpoints
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
          description: Authorization code returned by the Tango Verifier.
        - name: state
          in: query
          required: true
          schema:
            type: string
          description: Opaque state value to correlate the session request.
      responses:
        '200':
          description: Success — Device authenticated and marked online.
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - message
                  - decodedPayload
                properties:
                  status:
                    type: string
                    enum: [success]
                    example: success
                    description: Indicates the success of the operation.
                  message:
                    type: string
                    example: Authentication success. Device status updated to online.
                    description: A human-readable message explaining the result.
                  decodedPayload:
                    type: object
                    description: Decoded JWT payload containing claims such as sub, did, exp, etc.
                    example:
                      aud:
                        - "k8s-cluster.tango.rid-intrasoft.eu"
                      client_id: "did:web:ips.k8s-cluster.tango.rid-intrasoft.eu:did"
                      exp: 1747396583
                      iss: "did:web:ips.k8s-cluster.tango.rid-intrasoft.eu:did"
                      kid: "ULaW3a1G2l-m_Yh13uBGitxe4ULkzd5cAxh7tTgdeRs"
                      sub: "did:my:wallet"
                      verifiableCredential:
                        "@context":
                          - "https://www.w3.org/2018/credentials/v1"
                          - "https://example.com/custom-context"
                        credentialSchema:
                          id: "https://example.com/schema.json"
                          type: "JsonSchemaValidator2018"
                        credentialSubject:
                          id: "did:my:wallet"
                          # Add additional fields as relevant here
                        id: "urn:uuid:869f17ef-a48d-46d2-9567-322abea828a9"
                        issuanceDate: "2025-05-16T11:26:01Z"
                        issued: "2025-05-16T11:26:01Z"
                        issuer: "did:web:ips.k8s-cluster.tango.rid-intrasoft.eu:did"
                        proof:
                          type: "EcdsaSecp256k1VerificationKey2019"
                          # add other proof fields if desired
                        type:
                          - "VerifiableCredential"
                          - "IDCredential"
                        validFrom: "2025-05-16T11:26:01Z"


        '400':
          description: Missing required parameters.
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - message
                properties:
                  status:
                    type: string
                    enum: [failed]
                    example: failed
                    description: Indicates the operation failed due to client error.
                  message:
                    type: string
                    example: "Missing required parameters: code or state."
                    description: Explanation of what parameters are missing.

        '401':
          description: Unauthorized — Authentication failed due to missing or invalid credentials.
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - message
                properties:
                  status:
                    type: string
                    enum: [failed]
                    example: failed
                    description: Indicates that authentication was unsuccessful.
                  message:
                    type: string
                    description: Specific reason why the request was unauthorized.
              examples:
                tokenNotReceived:
                  summary: Missing authentication token
                  value:
                    status: failed
                    message: Authentication token not received.
                invalidPayload:
                  summary: Invalid token payload
                  value:
                    status: failed
                    message: Invalid authentication token payload.
                credentialsMismatch:
                  summary: Credentials don't match the device
                  value:
                    status: failed
                    message: Credentials don't match this device.


        '409':
          description: Conflict — Device is already online.
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - message
                properties:
                  status:
                    type: string
                    enum: [failed]
                    example: failed
                    description: Indicates the request could not be completed due to a conflict.
                  message:
                    type: string
                    enum: [Device already online.]
                    example: Device already online.
                    description: Conflict reason indicating the device is already marked as online.

        '410':
          description: Gone — Session request has expired.
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - message
                properties:
                  status:
                    type: string
                    enum: [failed]
                    example: failed
                    description: Indicates the resource is no longer available.
                  message:
                    type: string
                    enum: [Session request expired.]
                    example: Session request expired.
                    description: The session request has expired and is no longer valid.

        '500':
          description: Internal Server Error.
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - message
                properties:
                  status:
                    type: string
                    enum: [failed]
                    example: failed
                    description: Indicates an internal server error occurred.
                  message:
                    type: string
                    example: Internal server error. Authentication failed.
                    description: Error message describing the server failure.



  # [3] POST /authenticator/post-logs
  /authenticator/post-logs:
    post:
      summary: Accepts Android Logs from devices for risk assessment or localization
      description: |
        This endpoint accepts `logs` from Android devices along with a session `authToken` and device identifier (`did`) for authentication and validation.
        It performs multiple checks, including validation of log format, session token validity, expiration, and DID match.
        Upon successful validation, the log is queued for processing.
        Always returns HTTP 200 status regardless of the operation result, to maintain client-side stability. Check the `status` field in the response body for operation result.
      tags:
        - Authenticator Endpoints
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - did
                - log
                - authToken
              properties:
                did:
                  type: string
                  description: The Decentralized Identifier (DID) of the Android device.
                  example: "did:example:12345"
                log:
                  type: string
                  description: The log data captured from the device.
                  example: "11-22 13:11:21.537   799  1004 I WifiService: setWifiEnabled package=com.android.settings uid=1000 enable=true"
                authToken:
                  type: string
                  description: The authentication token associated with the device session.
                  example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
      responses:
        '200':
          description: A successful response containing the status of log processing. Always returns 200 regardless of the operation result, to maintain client-side stability. Check the `status` field in the response body.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: The status of the log capture operation.
                    example: "success"
                  message:
                    type: string
                    description: A human-readable message providing more context.
                    example: "Log successfully captured and queued for processing."
              examples:
                Success:
                  summary: Successful processing of logs
                  value:
                    status: success
                    message: Logs stored, analyzed and processed successfully.
                MissingLogData:
                  summary: Log data missing
                  value:
                    status: failed
                    message: Log data cannot be empty.
                MalformedLogDetected:
                  summary: Malformed log detected
                  value:
                    status: failed
                    message: Malformed log detected.
                MissingAccessToken:
                  summary: Authentication token missing
                  value:
                    status: failed
                    message: Authentication token is required.
                InvalidAccessTokenFormat:
                  summary: Invalid authentication token format
                  value:
                    status: failed
                    message: Invalid authentication token format.
                FailedToDecodeAccessToken:
                  summary: Failed to decode authentication token
                  value:
                    status: failed
                    message: Failed to decode authentication token.
                AuthTokenExpired:
                  summary: Authentication token expired
                  value:
                    status: failed
                    message: Authentication token has expired.
                AuthTokenDidMismatch:
                  summary: Authentication token DID mismatch
                  value:
                    status: failed
                    message: Authentication token did does not match the provided did.
                MissingTimestampInLog:
                  summary: Missing timestamp in log data
                  value:
                    status: failed
                    message: Invalid log data. Missing timestamp.
                FailedToStoreLogs:
                  summary: Failed to store logs
                  value:
                    status: failed
                    message: Failed to store logs in the Influx Database.
                FailedToPerformLocalization:
                  summary: Localization execution failed
                  value:
                    status: failed
                    message: Failed to perform localization.
                FailedToPerformRiskAssessmentEngine:
                  summary: Risk assessment execution failed
                  value:
                    status: failed
                    message: Failed to perform risk assessment.
                InternalServerError:
                  summary: Internal server error
                  value:
                    status: failed
                    message: Internal server error while processing session request.

  # [4] GET /authenticator/auth-token-validation
  /authenticator/auth-token-validation:
    get:
      summary: Validate the provided Bearer JWT authentication token to ensure the employee remains logged into the Authenticator Android Application
      description: |
        This endpoint validates the provided Bearer JWT token and checks if it is expired or malformed.
        Returns appropriate HTTP status codes based on validation results.
      tags:
        - Authenticator Endpoints
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - authToken
                - deviceID
              properties:
                authToken:
                  type: string
                  description: Bearer token to authenticate.
                  example: Bearer <your-jwt-token>
                deviceID:
                  type: string
                  description: Optional device ID associated with the token.
                  example: 5c487cb4a62cb29d

      responses:
        '200':
          description: Valid token, device found.
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - message
                  - did
                  - sub
                  - verifiableCredential
                properties:
                  status:
                    type: string
                    enum: [success]
                    example: success
                    description: Indicates successful validation.
                  message:
                    type: string
                    example: valid
                    description: Human-readable status message.
                  did:
                    type: string
                    example: did:web:ips.k8s-cluster.tango.rid-intrasoft.eu:did
                    description: The DID (Decentralized Identifier) associated with the token.
                  sub:
                    type: string
                    example: did:my:wallet
                    description: Subject claim from the token.
                  verifiableCredential:
                    type: object
                    description: The verifiable credential from the token payload.
                    example:
                      id: urn:uuid:869f17ef-a48d-46d2-9567-322abea828a9
        '400':
          description: Bad request - malformed or invalid token.
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - message
                properties:
                  status:
                    type: string
                    enum: [failed]
                    example: failed
                  message:
                    type: string
                    description: Explanation of the error.
              examples:
                MalformedToken:
                  summary: Malformed Authorization Token
                  value:
                    status: failed
                    message: "Authentication token is malformed. It should start with 'Bearer '."
                InvalidFormat:
                  summary: Token format is invalid or cannot be decoded
                  value:
                    status: failed
                    message: "Invalid authentication token format."
                MissingDID:
                  summary: Device ID missing from token payload
                  value:
                    status: failed
                    message: "Device ID missing from authentication token."

        '401':
          description: Unauthorized - missing or expired token.
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - message
                properties:
                  status:
                    type: string
                    enum: [failed]
                    example: failed
                  message:
                    type: string
                    description: Explanation of why the authentication failed.
              examples:
                MissingToken:
                  summary: Authentication token is missing
                  value:
                    status: failed
                    message: "Authentication token is missing."
                ExpiredToken:
                  summary: Authentication token has expired
                  value:
                    status: failed
                    message: "Authentication token has expired."

        '404':
          description: Device associated with DID not found.
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - message
                properties:
                  status:
                    type: string
                    enum: [failed]
                    example: failed
                  message:
                    type: string
                    example: "Device not found."
        '500':
          description: Internal server error during token validation.
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - message
                properties:
                  status:
                    type: string
                    enum: [failed]
                    example: failed
                  message:
                    type: string
                    example: "Internal server error while validating authentication token."



  # [5] POST /authenticator/logout
  /authenticator/logout:
    post:
      summary: Logs out a device by marking its status as "offline" in the database
      description: |
        This endpoint allows a device to log out by providing an `authToken`, `did`, and `deviceID`. The request validates the authentication token and identifiers. If the device is found, its status is updated to "offline". The operation returns appropriate HTTP status codes with a JSON body indicating success or failure.
      tags:
        - Authenticator Endpoints
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - authToken
                - did
                - deviceID
              properties:
                authToken:
                  type: string
                  description: The authentication token for verifying the session.
                  example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                did:
                  type: string
                  description: The Decentralized Identifier (DID) of the device.
                  example: "did:example:12345"
                deviceID:
                  type: string
                  description: The unique device identifier.
                  example: "5c487cb4a62cb29d"
      responses:
        '200':
          description: Device logged out successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Device logged out successfully.
              examples:
                Success:
                  summary: Successful logout
                  value:
                    status: success
                    message: Device logged out successfully.
        '400':
          description: Bad request due to missing required fields.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: failed
                  message:
                    type: string
              examples:
                MissingAuthToken:
                  summary: Missing Authentication token
                  value:
                    status: failed
                    message: Missing required authentication token.
                MissingDid:
                  summary: Missing DID
                  value:
                    status: failed
                    message: Missing required did.
                MissingDeviceID:
                  summary: Missing device ID
                  value:
                    status: failed
                    message: Missing required device ID.
        '404':
          description: Device not found in the database.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: failed
                  message:
                    type: string
                    example: Device not found.
              examples:
                DeviceNotFound:
                  summary: Device not found
                  value:
                    status: failed
                    message: Device not found.
        '500':
          description: Internal server error during logout.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: failed
                  message:
                    type: string
                    example: Internal server error while handling logout.
              examples:
                InternalServerError:
                  summary: Internal Server Error
                  value:
                    status: failed
                    message: Internal server error while handling logout.
