openapi: 3.0.0
info:
  title: Devices Continuous Behavioural Authentication (DCBA) Mechanisms API
  version: 1.0.0
  description: |
    API documentation for the DCBA Services.
    Authentication is now handled through a PEP/PDP access control mechanism.

servers:
  - url: https://dcba-tango.riastone.eu/

components:
  responses:
    GetNotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: string
              message:
                type: string
          examples:
            ResourceNotFound:
              summary: Resource not found (GET)
              value:
                status: "failed"
                message: "Cannot GET. Resource not found"

    PostNotFound:
      description: Resource not found for POST
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: string
              message:
                type: string
          examples:
            PostResourceNotFound:
              summary: Resource not found (POST)
              value:
                status: "failed"
                message: "Cannot POST. Resource not found"


paths:
  # Resource API Endpoints #

  # [1] GET /resource/devices
  /resource/devices:
    get:
      tags:
        - Resource API Endpoints  # Tag for service-facing endpoints
      summary: Fetch all devices
      description: >
        Retrieves all device entries from the database.
      responses:
        '200':
          description: Successfully fetched devices
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "success"
                  message:
                    type: string
                    example: "Devices fetched successfully"
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        device_id:
                          type: string
                        did:
                          type: string
                        sub:
                          type: string
              examples:
                NoDeviceFetched:
                  summary: Example with no devices fetched
                  value:
                    status: "success"
                    message: "Devices fetched successfully"
                    data: []
                SingleDeviceFetched:
                  summary: Example list of a device
                  value:
                    status: "success"
                    message: "Devices fetched successfully"
                    data:
                      - device_id: "5c487cb4a62cb29d"
                        did: "urn:uuid:06e3f05a-51ce-46e9-a9b9-e2cf27fd10e7"
                        sub: "did:my:wallet"
                MultipleDevicesFetched:
                  summary: Example list of devices
                  value:
                    status: "success"
                    message: "Devices fetched successfully"
                    data:
                      - device_id: "5c487cb4a62cb29d"
                        did: "urn:uuid:06e3f05a-51ce-46e9-a9b9-e2cf27fd10e7"
                        sub: "did:my:wallet"
                      - device_id: "fc9a978d5223b680"
                        did: "urn:uuid:a886e2e6-63d8-4e5b-836a-345427eec5ff"
                        sub: "did:my:wallet"
                      - device_id: "gi9b459o5333c612"
                        did: "urn:uuid:b115d2e6-03c9-3t7h-000a-125374ffp9ll"
                        sub: "did:my:wallet"
        '500':
          description: Internal server error while fetching devices
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "failed"
                  message:
                    type: string
              examples:
                Error fetching device data:
                  summary: Error fetching device data
                  value:
                    status: "failed"
                    message: "Error fetching device data"
                Error fetching resource:
                  summary: Error fetching resource
                  value:
                    status: "failed"
                    message: "Error fetching resource"




  # [2] GET /resource/online-devices  
  /resource/online-devices:
