          description: Successfully fetched online devices
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "success"
                  message:
                    type: string
                    example: "Fetched online devices successfully"
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        device_id:
                          type: string
                        did:
                          type: string
                        sub:
                          type: string
              examples:
                NoOnlineDeviceFetched:
                  summary: Example with no online devices fetched
                  value:
                    status: "success"
                    message: "Fetched online devices successfully"
                    data: []
                SingleOnlineDeviceFetched:
                  summary: Example list of an online device
                  value:
                    status: "success"
                    message: "Fetched online devices successfully"
                    data:
                      - device_id: "5c487cb4a62cb29d"
                        did: "urn:uuid:06e3f05a-51ce-46e9-a9b9-e2cf27fd10e7"
                        sub: "did:my:wallet"
                MultipleOnlineDevicesFetched:
                  summary: Example list of online devices
                  value:
                    status: "success"
                    message: "Fetched online devices successfully"
                    data:
                      - device_id: "5c487cb4a62cb29d"
                        did: "urn:uuid:06e3f05a-51ce-46e9-a9b9-e2cf27fd10e7"
                        sub: "did:my:wallet"
                      - device_id: "fc9a978d5223b680"
                        did: "urn:uuid:a886e2e6-63d8-4e5b-836a-345427eec5ff"
                        sub: "did:my:wallet"
                      - device_id: "gi9b459o5333c612"
                        did: "urn:uuid:b115d2e6-03c9-3t7h-000a-125374ffp9ll"
                        sub: "did:my:wallet"
        '500':
          description: Internal server error while fetching online devices
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "failed"
                  message:
                    type: string
              examples:
                Error fetching online device data:
                  summary: Error fetching online device data
                  value:
                    status: "failed"
                    message: "Error fetching online devices"
                Error fetching resource:
                  summary: Error fetching resource
                  value:
                    status: "failed"
                    message: "Error fetching resource"

