<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Access Map</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: url('/frontend/background.png') no-repeat center center fixed;
      background-size: cover;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .spinner {
      margin-top: 20px;
      border: 4px solid #f3f3f3;
      border-top: 4px solid #4CAF50;
      border-radius: 50%;
      width: 30px;
      height: 30px;
      animation: spin 1s linear infinite;
      display: none;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 60px;
      flex-grow: 1;
    }

    h1 {
      font-size: 32px;
      margin-bottom: 10px;
      color: #333;
    }

    p.description {
      font-size: 16px;
      margin-bottom: 40px;
      color: #555;
    }

    .container {
      background: #fff;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.1);
      display: flex;
      gap: 40px;
    }

    .left, .right {
      display: flex;
      flex-direction: column;
    }

    .left input {
      padding: 10px;
      font-size: 16px;
      width: 260px;
      border-radius: 5px;
      border: 1px solid #ccc;
      margin-bottom: 16px;
    }

    .right label {
      margin-bottom: 10px;
      font-size: 15px;
    }

    h2 {
      margin-bottom: 10px;
    }

    .submit-btn {
      margin-top: 30px;
      background-color: #4CAF50;
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 16px;
      border-radius: 6px;
      cursor: pointer;
      box-shadow: 0 5px 0 #3e8e41;
      transition: all 0.1s ease-in-out;
    }

    .submit-btn:active {
      box-shadow: 0 2px 0 #3e8e41;
      transform: translateY(3px);
    }

    .message {
      margin-top: 20px;
      font-size: 15px;
      padding: 12px 20px;
      border-radius: 6px;
      width: 320px;
      text-align: center;
      display: none;
    }

    .message.error {
      background-color: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }

    .message.success {
      background-color: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }

    footer {
      text-align: center;
      padding: 20px 0;
      font-size: 14px;
      color: #666;
      background-color: transparent;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <h1>EMPLOYEE ACCESS MAP</h1>
    <p class="description">  Provide the <strong>Authorization Password</strong>, the employee's <strong>Passport ID</strong>, and select the <strong>areas</strong> the employee is permitted to access.</p>

    <div class="container">
      <!-- Left section -->
      <div class="left">
        <h2>Authorization Password</h2>
        <input type="password" placeholder="Enter authorization password" id="authPassword" />

        <h2 style="margin-top: 20px;">Passport ID</h2>
        <input type="text" placeholder="Enter passport ID" id="passportId" />
      </div>

      <!-- Right section -->
      <div class="right">
        <h2>Permitted Areas</h2>
        <label><input type="checkbox" value="PERMITTED_AREA" checked disabled> PERMITTED_AREA</label>
        <label><input type="checkbox" value="WAREHOUSE"> WAREHOUSE</label>
        <label><input type="checkbox" value="PACKAGING_LINES"> PACKAGING_LINES</label>
        <label><input type="checkbox" value="SORTING_LINES_1_TO_3"> SORTING_LINES_1_TO_3</label>
        <label><input type="checkbox" value="SORTING_LINES_4_AND_5"> SORTING_LINES_4_AND_5</label>
        <label><input type="checkbox" value="SORTING_LINES_6_TO_8"> SORTING_LINES_6_TO_8</label>
      </div>
    </div>

    <button class="submit-btn" id="applyBtn">Apply Changes</button>
    <div class="spinner" id="spinner"></div>
    <div class="message" id="messageBox"></div>
  </div>

  <footer>
    For support, please contact IT at <a href="mailto:nitlab@inf.uth.gr">nitlab@inf.uth.gr</a>
  </footer>

  <script>
    const applyBtn = document.getElementById('applyBtn');
    const passportInput = document.getElementById('passportId');
    const authPasswordInput = document.getElementById('authPassword');
    const checkboxes = document.querySelectorAll('.right input[type="checkbox"]');
    const messageBox = document.getElementById('messageBox');
    const spinner = document.getElementById('spinner');

    applyBtn.addEventListener('click', () => {
      const passportId = passportInput.value.trim();
      const authPassword = authPasswordInput.value.trim();
      const permittedAreas = Array.from(checkboxes).filter(chk => chk.checked).map(chk => chk.value);
      const restrictedAreas = Array.from(checkboxes).filter(chk => !chk.checked).map(chk => chk.value);

      // Reset message
      messageBox.style.display = 'none';
      messageBox.className = 'message';

      // New condition: Neither password nor passport ID entered
      if (!authPassword && !passportId) {
        showMessage('Please enter both Authorization Password and Passport ID.', 'error');
        return;
      }

      if (!authPassword) {
        showMessage('Please enter the Authorization Password.', 'error');
        return;
      }

      if (!passportId && permittedAreas.length === 0) {
        showMessage('Please enter a Passport ID and select at least one permitted area.', 'error');
      } else if (passportId && permittedAreas.length === 0) {
        showMessage('Please select at least one permitted area for the entered Passport ID.', 'error');
      } else if (!passportId && permittedAreas.length > 0) {
        showMessage('Please enter a Passport ID before selecting permitted areas.', 'error');
      } else {
        // ✅ Submit data to the backend
        spinner.style.display = 'block';
        fetch('https://dcba-tango.riastone.eu/frontend/device-access-map', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            ePassportId: passportId,
            permittedAreas: permittedAreas,
            restrictedAreas: restrictedAreas,
            authPassword: authPassword
          })
        })
        .then(async response => {
          const data = await response.json();
          spinner.style.display = 'none'; 

          if (response.ok) {
            showMessage(data.message || 'Success', 'success');
            resetForm();
          } else {
            showMessage(data.message || 'An error occurred.', 'error');
          }
        })
        .catch(err => {
          console.error(err);
          showMessage('Failed to submit data. Please try again later.', 'error');
        });
      }
    });


    function showMessage(msg, type) {
      messageBox.textContent = msg;
      messageBox.classList.add(type);
      messageBox.style.display = 'block';
    }
    function resetForm() {
      passportInput.value = '';
      checkboxes.forEach(chk => {
        if (!chk.disabled) {
          chk.checked = false;
        }
      });
      // 🔐 Don't clear the authPassword field
    }
  </script>
</body>
</html>
