<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Access Map</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(to right, #eef1f5, #dbe2ea);
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 60px;
      flex-grow: 1;
    }

    h1 {
      font-size: 32px;
      margin-bottom: 10px;
      color: #333;
    }

    p.description {
      font-size: 16px;
      margin-bottom: 40px;
      color: #555;
    }

    .container {
      background: #fff;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.1);
      display: flex;
      gap: 40px;
    }

    .left, .right {
      display: flex;
      flex-direction: column;
    }

    .left input {
      padding: 10px;
      font-size: 16px;
      width: 260px;
      border-radius: 5px;
      border: 1px solid #ccc;
    }

    .right label {
      margin-bottom: 10px;
      font-size: 15px;
    }

    h2 {
      margin-bottom: 10px;
    }

    .submit-btn {
      margin-top: 30px;
      background-color: #4CAF50;
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 16px;
      border-radius: 6px;
      cursor: pointer;
      box-shadow: 0 5px 0 #3e8e41;
      transition: all 0.1s ease-in-out;
    }

    .submit-btn:active {
      box-shadow: 0 2px 0 #3e8e41;
      transform: translateY(3px);
    }

    footer {
      text-align: center;
      padding: 20px 0;
      font-size: 14px;
      color: #666;
      background-color: transparent;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <h1>Access Map</h1>
    <p class="description">Enter passport ID and the corresponding permitted areas of the employee.</p>

    <div class="container">
      <!-- Left section: passport ID -->
      <div class="left">
        <h2>Passport ID</h2>
        <input type="text" placeholder="Enter passport ID" id="passportId" />
      </div>

      <!-- Right section: location checkboxes -->
      <div class="right">
        <h2>Permitted Areas</h2>
        <label><input type="checkbox" value="WAREHOUSE"> WAREHOUSE</label>
        <label><input type="checkbox" value="PACKAGING_LINES"> PACKAGING_LINES</label>
        <label><input type="checkbox" value="PERMITTED_AREA"> PERMITTED_AREA</label>
        <label><input type="checkbox" value="SORTING_LINES_1_TO_3"> SORTING_LINES_1_TO_3</label>
        <label><input type="checkbox" value="SORTING_LINES_4_AND_5"> SORTING_LINES_4_AND_5</label>
        <label><input type="checkbox" value="SORTING_LINES_6_TO_8"> SORTING_LINES_6_TO_8</label>
      </div>
    </div>

    <button class="submit-btn">Apply Changes</button>
  </div>

  <footer>
    For support, please contact IT at <a href="mailto:nitlab@inf.uth.gr">nitlab@inf.uth.gr</a>
  </footer>
</body>
</html>
