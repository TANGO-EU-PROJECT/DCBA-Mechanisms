<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Login</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(to right, #eef1f5, #dbe2ea);
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      align-items: center;
      justify-content: center;
    }

    header {
      position: absolute;
      top: 30px;
      width: 100%;
      text-align: center;
    }

    header h1 {
      font-size: 28px;
      color: #333;
      margin: 0;
      font-weight: bold;
    }

    .login-container {
      background: #fff;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.1);
      width: 320px;
      text-align: center;
    }

    input[type="text"], input[type="password"] {
      width: 100%;
      padding: 12px;
      margin-bottom: 16px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 15px;
    }

    .login-btn {
      background-color: #4CAF50;
      color: white;
      border: none;
      padding: 10px 24px;
      font-size: 16px;
      border-radius: 6px;
      cursor: pointer;
      width: auto;
      box-shadow: 0 5px 0 #3e8e41;
      transition: all 0.1s ease-in-out;
      margin: 0 auto;
      display: block;
    }

    .login-btn:active {
      box-shadow: 0 2px 0 #3e8e41;
      transform: translateY(3px);
    }

    .login-message {
      margin-top: 16px;
      font-size: 14px;
      color: red;
      display: none;
    }

    footer {
      position: absolute;
      bottom: 16px;
      font-size: 14px;
      color: #666;
    }
  </style>
</head>
<body>

  <header>
    <h1>RIASTONE ACCESS MAP</h1>
  </header>

  <div class="login-container">
    <input type="text" id="username" placeholder="Username" />
    <input type="password" id="password" placeholder="Password" />
    <button class="login-btn" onclick="handleLogin()">Login</button>
    <div class="login-message" id="loginMessage">Invalid credentials</div>
  </div>

  <footer>
    For support, contact <a href="mailto:nitlab@inf.uth.gr">nitlab@inf.uth.gr</a>
  </footer>

  <script>
  async function handleLogin() {
    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value.trim();
    const loginMessage = document.getElementById("loginMessage");

    try {
      const response = await fetch('/login-credentials', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });

      if (response.ok) {
        // Login success: redirect to access-map page
        window.location.href = "/frontend/access-map";
      } else {
        // Login failed: show error
        loginMessage.style.display = "block";
        setTimeout(() => loginMessage.style.display = "none", 4000);
      }
    } catch (error) {
      console.error('Login error:', error);
      loginMessage.style.display = "block";
      loginMessage.textContent = "Server error, please try again.";
      setTimeout(() => {
        loginMessage.style.display = "none";
        loginMessage.textContent = "Invalid credentials"; // Reset message
      }, 4000);
    }
  }
</script>



</body>
</html>
